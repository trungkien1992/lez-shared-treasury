[package]
name = "treasury-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lifecycle-core = { path = "../core" }
lifecycle-methods = { path = "../methods" }
approval-core = { path = "../../core" }
lee = { path = "../../../lez-upstream/lee/state_machine" }
lee_core = { path = "../../../lez-upstream/lee/state_machine/core", features = ["host"] }
borsh.workspace = true
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
anyhow = "=1.0.100"
hex = "=0.4.3"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
risc0-zkvm = { workspace = true, features = ["disable-dev-mode"] }
