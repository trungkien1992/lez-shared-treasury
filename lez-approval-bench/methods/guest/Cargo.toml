[package]
name = "approval-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
approval-core = { path = "../../core" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }
hex = "=0.4.3"

# Official RISC Zero acceleration patches, pinned to the release commits.
# These patches apply only to the guest; the host retains the upstream crates
# as an independent control for the same approval fixtures.
[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", rev = "7d4a8d6477e258ce4169ee4669cf92aee0582c39" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", rev = "8631fabdea7bdffa97b11868e04e73491d8e5bcf" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }

[profile.release]
codegen-units = 1
lto = "thin"
